<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f6f4" />
    <meta name="author" content="Bipin Rizal" />
    <meta name="application-name" content="ImagZal" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('imagzal-theme');
          const theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <meta
      name="description"
      content="ImagZal is a small set of browser tools by Bipin Rizal: convert images, turn PDF pages into images, and make a PDF from your photos. Nothing is uploaded."
    />
    <meta property="og:title" content="ImagZal — image and PDF tools" />
    <meta
      property="og:description"
      content="Convert images, turn PDF pages into images, and make a PDF from photos. All on your device."
    />
    <meta property="og:type" content="website" />
    <title>ImagZal — image and PDF tools by Bipin Rizal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
